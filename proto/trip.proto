syntax = "proto3";

package surge.trip.v1;

option go_package = "github.com/ishakdeveloper/surge/shared/proto/trip;trip";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

// TripService owns the trip lifecycle and is the only writer of trip state.
//
// Synchronous on purpose, and the contrast with the rest of the system is the
// point. Location and matching are event-driven because they are streams: a
// position is one of thousands a second and nobody waits for it. A rider
// pressing "request ride" is waiting, and wants an answer — a fare, a trip id,
// or a reason it cannot happen. Modelling that as an event and correlating a
// reply would be an RPC with extra steps and worse error handling.
// The HTTP mapping lives here, next to the RPC it maps, and grpc-gateway
// generates the REST surface from it. That is the point: hand-written handlers
// mean the REST API and the gRPC contract are two sources of truth, and the
// first thing they do is drift — the reference this project borrows from has a
// TypeScript contract file and a Go one that already disagree about which
// events exist.
//
// Paths follow Google's API design guide: plural collections, and custom
// methods as `:verb` rather than as invented sub-resources.
service TripService {
  // Preview quotes a trip without committing to it. Read-only, so a rider
  // dragging a pin can call it repeatedly.
  //
  // POST rather than GET despite being read-only: the request carries two
  // coordinate pairs, and a GET would put a rider's exact pickup and dropoff
  // into every access log and browser history along the way.
  rpc PreviewTrip(PreviewTripRequest) returns (PreviewTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips:preview"
      body: "*"
    };
  }

  // Create commits a previewed fare to a real trip and starts matching.
  //
  // Takes an idempotency key because the caller is a browser on a phone
  // network: a retried request must return the original trip rather than
  // booking a second one.
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips"
      body: "*"
    };
  }

  // Get returns a trip's current state.
  rpc GetTrip(GetTripRequest) returns (GetTripResponse) {
    option (google.api.http) = {get: "/v1/trips/{trip_id}"};
  }

  // Cancel ends a trip before completion.
  //
  // A custom method rather than DELETE: cancelling is a state transition that
  // returns the trip, not a deletion — the row stays, and a rider can still
  // read what happened to it.
  rpc CancelTrip(CancelTripRequest) returns (CancelTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:cancel"
      body: "*"
      // A second route for the same method, because `:verb` is Google's
      // convention and not everyone's router. Effect's, for one, parses
      // `/v1/trips/:tripId:cancel` as a parameter literally named
      // "tripId:cancel" — a colon means something to it in that position.
      //
      // additional_bindings exists for exactly this: one implementation, two
      // paths, no second handler to keep in step.
      additional_bindings: {
        post: "/v1/trips/{trip_id}/cancel"
        body: "*"
      }
    };
  }

  // ListTrips is a rider's history, newest first.
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse) {
    option (google.api.http) = {get: "/v1/trips"};
  }
}

// The caller is NOT a field on any request.
//
// It arrives as gRPC metadata, put there by the gateway from a verified token.
// This matters more now that the REST body maps straight onto the message: a
// `rider_id` field would be client-supplied, and a client that can name the
// rider can quote, book and read rides as somebody else.
message PreviewTripRequest {
  surge.common.v1.Coordinate pickup = 1;
  surge.common.v1.Coordinate dropoff = 2;
}

message PreviewTripResponse {
  // Quotes for each vehicle class, priced from the same route.
  repeated FareQuote fares = 1;
  surge.common.v1.Route route = 2;
}

message FareQuote {
  string fare_id = 1;
  // Sedan, van and so on. A string rather than an enum because the catalogue is
  // operator configuration, not a protocol change.
  string package_slug = 2;
  int64 total_cents = 3;
  // The multiplier applied for demand in the pickup cell at quote time. Carried
  // explicitly so a rider can be shown why a fare is what it is.
  double surge_multiplier = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message CreateTripRequest {
  string fare_id = 1;
  // Generated client-side, so a retry over a flaky connection is recognised
  // rather than booked twice. Over REST this also arrives as an
  // `Idempotency-Key` header, which the gateway copies into the field.
  string idempotency_key = 2;
}

message CreateTripResponse {
  Trip trip = 1;
}

message GetTripRequest {
  string trip_id = 1;
}

message GetTripResponse {
  Trip trip = 1;
}

message CancelTripRequest {
  string trip_id = 1;
  string reason = 2;
}

message CancelTripResponse {
  Trip trip = 1;
}

message ListTripsRequest {
  // Page size. Clamped by the server; a client asking for everything gets a
  // page, because "return the whole table" is not a request a public API
  // should honour.
  int32 page_size = 1;
  // Opaque cursor from a previous response. Opaque on purpose: a client that
  // decodes it is a client that breaks when the ordering changes.
  string page_token = 2;
  // Optional status filter, e.g. "completed".
  string status = 3;
}

message ListTripsResponse {
  repeated Trip trips = 1;
  // Empty when there are no more.
  string next_page_token = 2;
}

message Trip {
  string id = 1;
  string rider_id = 2;
  string driver_id = 3;
  TripStatus status = 4;
  surge.common.v1.Coordinate pickup = 5;
  surge.common.v1.Coordinate dropoff = 6;
  surge.common.v1.Route route = 7;
  int64 total_cents = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// TripStatus is the state machine, and the wire is the place it is written
// down once. UNSPECIFIED is reserved by convention so an unset field is not
// silently a valid state.
enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_REQUESTED = 1;
  TRIP_STATUS_OFFERED = 2;
  TRIP_STATUS_ACCEPTED = 3;
  TRIP_STATUS_ARRIVED = 4;
  TRIP_STATUS_IN_PROGRESS = 5;
  TRIP_STATUS_COMPLETED = 6;
  TRIP_STATUS_CANCELLED = 7;
  // No driver was found before the request expired. Distinct from cancelled:
  // nobody chose it, and the rider should be offered a retry rather than an
  // apology.
  TRIP_STATUS_UNMATCHED = 8;
}
