# Local infrastructure. The Go services and the simulator run on the HOST, not
# in here — that keeps the reload loop at a compile rather than an image build,
# and leaves the VM to the things that actually need it.
#
# Runs on OrbStack. Worth knowing why: Docker Desktop wedged under this
# workload, and a wedged Docker Desktop keeps its host port bindings, so
# localhost:55433 kept accepting connections and never answering them while a
# perfectly healthy Postgres sat behind a different runtime. If the ports below
# are open but nothing responds, check `docker context ls` and whether a stale
# com.docker.backend still holds them.
#
# Budget, enforced rather than hoped for: every container has a CPU and memory
# cap below. On a 16 GB laptop the VM competes with the browser, the editor
# and the Go services on the host, and an uncapped container under load is how
# the whole machine starts swapping and freezes. The caps sum to about 7
# CPUs and 5 GB, inside a VM capped at 4 CPUs and 4 GB, so contention stays in
# the VM instead of reaching the desktop.
#
# `make up` starts everything. Prometheus, Grafana, Jaeger and Redpanda Console
# are nonetheless their own `observability` profile, so `make up-core` can
# leave them out when the laptop needs the headroom: together they were the
# second largest CPU cost here after Redpanda itself.

name: surge

# The `app` profile: the system itself, from its images, beside the
# infrastructure above. It is what CI's end-to-end job runs and what `make e2e`
# runs here, so the tests exercise the artifacts that ship rather than a dev
# server. SURGE_TAG picks the images: `dev` from `make images`, or `ci` from the
# job that just built them.
#
# It binds the same ports as `make dev-*`, so it is one or the other.
#
#   make images
#   docker compose -f deploy/compose/docker-compose.yml --profile app up -d --wait
x-app: &app
  profiles: [app]
  restart: unless-stopped

# What every Go service reads. Names, not localhost: these reach each other on
# the compose network.
x-go-env: &go-env
  KAFKA_BROKERS: redpanda:9092
  KAFKA_REPLICATION_FACTOR: "1"

# The simulator's token secret, which the gateway must share to accept the
# drivers it mints. A fixed value: this profile is for tests, never for traffic.
x-sim-secret: &sim-secret surge-app-profile-simulator-secret-0123456789

services:
  # Ports are deliberately off the defaults: this machine already has a native
  # Postgres on 5432 and a Redis on 6379, and an ambiguous bind is a debugging
  # trap you only notice after an hour of "why is that table missing".
  postgres:
    image: postgres:17-alpine
    container_name: surge-postgres
    environment:
      POSTGRES_DB: surge
      POSTGRES_USER: surge
      POSTGRES_PASSWORD: surge
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the second database. The image runs anything in here once, on
      # an empty data directory — so `make nuke` is what re-runs it.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surge -d surge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka, without the JVM or ZooKeeper. `dev-container` mode is what makes a
  # single broker viable on a laptop: it disables the production memory and
  # fsync assumptions that otherwise refuse to start on constrained hardware.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: surge-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Host processes connect on localhost:19092; containers use redpanda:9092.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18081:18081"
      - "9644:9644"
    volumes:
      - redpanda:/var/lib/redpanda/data
    # --smp=1 pins Seastar's reactor to one core; the rest is its helper
    # threads. Above the 1G it allocates for itself, for page cache headroom.
    cpus: 1.5
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:latest
    container_name: surge-redpanda-console
    profiles: [observability]
    cpus: 0.5
    mem_limit: 384m
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_started

  # Road geometry and the time/distance matrix that batched assignment needs.
  #
  # Native arm64, unlike osrm-backend. The FIRST boot downloads a 189MB extract
  # and builds tiles — 10-20 minutes, watch it once — then caches into the
  # volume. `use_tiles_ignore_pbf` defaults to True, which would skip the build
  # entirely, so it has to be False here for that first run to happen at all.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: surge-valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/europe/netherlands/noord-holland-latest.osm.pbf
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      build_admins: "True"
      build_time_zones: "False"
      build_elevation: "False"
      serve_tiles: "True"
      # Four threads and two CPUs: batched matching asks every shard's travel
      # times every two seconds. At 1.5 CPUs and two threads a benchmark had
      # 27% of those solves time out and fall back to straight-line distance.
      server_threads: "4"
    # The first tile build wants more than serving does; if a `make nuke`
    # rebuild dies, raise this for that one run.
    cpus: 2
    mem_limit: 1536m
    # curl, because the image has no wget — a check written with it failed on
    # every run, so nothing could ever wait on Valhalla being healthy. And
    # 127.0.0.1 rather than localhost, which resolves to ::1 first here.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 20m

  prometheus:
    image: prom/prometheus:latest
    container_name: surge-prometheus
    profiles: [observability]
    cpus: 1
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      # The simulator moves the load in seconds; a 15s default scrape turns a
      # ramp into three points. This is a load rig, so it scrapes fast.
      - --enable-feature=otlp-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: surge-grafana
    profiles: [observability]
    cpus: 0.5
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: surge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    # This host already runs other projects on 3000/3001, so Surge takes 3005.
    ports:
      - "3005:3000"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: surge-jaeger
    profiles: [observability]
    cpus: 0.5
    mem_limit: 512m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  # --- the app profile ------------------------------------------------------
  #
  # Migrations first, as one-shot containers, and never at boot: the same rule
  # the cluster's Jobs follow. The rest waits for them to exit cleanly. They
  # retry because Postgres can answer its health check while its init script
  # is still creating the second database.
  migrate:
    <<: *app
    image: surge/migrate:${SURGE_TAG:-dev}
    restart: on-failure:10
    environment:
      DATABASE_URL: postgresql://surge:surge@postgres:5432/surge
    depends_on:
      postgres: { condition: service_healthy }

  migrate-auth:
    <<: *app
    image: surge/auth:${SURGE_TAG:-dev}
    restart: on-failure:10
    command: ["node", "packages/database/build/bundle/migrate.js"]
    environment:
      AUTH_DATABASE_URL: postgresql://surge:surge@postgres:5432/surge_auth
    depends_on:
      postgres: { condition: service_healthy }

  auth:
    <<: *app
    image: surge/auth:${SURGE_TAG:-dev}
    environment:
      PORT: "3200"
      AUTH_DATABASE_URL: postgresql://surge:surge@postgres:5432/surge_auth
      AUTH_SECRET: surge-app-profile-auth-secret-not-for-anything-real
      # What a browser reaches, through the port below, and so what auth signs
      # tokens as. The gateway's AUTH_ISSUER must say the same.
      AUTH_BASE_URL: http://localhost:3200
      WEB_URL: http://localhost:5273
      # The end-to-end tests read sign-in codes from the dev outbox. Never set
      # anywhere a real person signs in.
      AUTH_DEV_OUTBOX: "true"
    ports: ["3200:3200"]
    depends_on:
      migrate-auth: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    <<: *app
    image: surge/web:${SURGE_TAG:-dev}
    environment:
      PORT: "5273"
      # What the browser is told, at runtime: the ports below, on localhost.
      SURGE_API_URL: http://localhost:8100
      SURGE_WS_URL: ws://localhost:8100/ws
      AUTH_BASE_URL: http://localhost:3200
      # What this server uses itself, on the compose network.
      AUTH_INTERNAL_URL: http://auth:3200
    ports: ["5273:5273"]
    depends_on:
      auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5273,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    <<: *app
    image: surge/gateway:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      GATEWAY_ORIGINS: http://localhost:5273
      TRIP_GRPC_ADDR: trip:8110
      PAYMENTS_GRPC_ADDR: payments:8112
      CHAT_GRPC_ADDR: chat:8113
      FLEET_GRPC_ADDR: fleet:8115
      SIM_GRPC_ADDR: simulator:8111
      AUTH_JWKS_URL: http://auth:3200/api/auth/jwks
      AUTH_ISSUER: http://localhost:3200
      AUTH_AUDIENCE: surge
      SIM_ENABLED: "true"
      SIM_TOKEN_SECRET: *sim-secret
    ports: ["8100:8100"]
    depends_on:
      auth: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8100/ready"]
      interval: 5s
      timeout: 5s
      retries: 60

  ingest:
    <<: *app
    image: surge/ingest:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
    depends_on:
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9102/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  matcher:
    <<: *app
    image: surge/matcher:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      VALHALLA_URL: http://valhalla:8002
    depends_on:
      redpanda: { condition: service_healthy }
      valhalla: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9103/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  trip:
    <<: *app
    image: surge/trip:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      DATABASE_URL: postgresql://surge:surge@postgres:5432/surge
      VALHALLA_URL: http://valhalla:8002
      TRIP_REQUIRE_PAYMENT: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
      valhalla: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9105/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  payments:
    <<: *app
    image: surge/payments:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      DATABASE_URL: postgresql://surge:surge@postgres:5432/surge
      PAYMENTS_PROCESSOR: fake
      PAYMENTS_WEB_URL: http://localhost:5273
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9107/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  chat:
    <<: *app
    image: surge/chat:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      DATABASE_URL: postgresql://surge:surge@postgres:5432/surge
      TRIP_GRPC_ADDR: trip:8110
      # Nobody's phone buzzes for a test run.
      CHAT_PUSH_PROVIDER: fake
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9108/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  fleet:
    <<: *app
    image: surge/fleet:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      DATABASE_URL: postgresql://surge:surge@postgres:5432/surge
      # Nobody's licence is checked here, documents go nowhere, and the vehicle
      # register is not called: a test run must not depend on the RDW being up.
      FLEET_IDENTITY_PROVIDER: fake
      FLEET_DOCUMENT_STORE: memory
      FLEET_REGISTER: fake
      FLEET_READER: "off"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9110/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  # No drivers until a test asks for some. A simulated driver near a test's
  # pickup could take the offer meant for the test's own driver.
  simulator:
    <<: *app
    image: surge/simulator:${SURGE_TAG:-dev}
    environment:
      <<: *go-env
      VALHALLA_URL: http://valhalla:8002
      SIM_DRIVERS: "0"
      SIM_REQUESTS_PER_SECOND: "0"
      SIM_TOKEN_SECRET: *sim-secret
    depends_on:
      gateway: { condition: service_healthy }
      valhalla: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/health"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  redpanda:
  valhalla:
