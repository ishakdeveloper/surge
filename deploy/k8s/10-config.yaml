# Everything non-secret the services read, in one place.
#
# Addresses are in-cluster service names, so no service knows whether the thing
# it is talking to is one pod or twenty. That is the only part of Kubernetes
# this project actually needs: a stable name in front of a changing set of pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: surge-config
  namespace: surge
data:
  KAFKA_BROKERS: "redpanda:9092"
  REDIS_ADDR: "redis:6379"
  VALHALLA_URL: "http://valhalla:8002"
  DATABASE_URL: "postgresql://surge:surge@postgres:5432/surge"

  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  # Head-based, parent-based sampling. Exporting every span at ten thousand
  # pings a second makes the collector the bottleneck and the service under test
  # spend its time on telemetry.
  OTEL_TRACES_SAMPLER_ARG: "0.01"

  # Two variables, because they answer different questions: where the trip
  # service binds, and where its callers dial. They were one until a deploy
  # proved otherwise.
  TRIP_GRPC_LISTEN: ":8110"
  TRIP_GRPC_ADDR: "trip:8110"
  GATEWAY_HTTP_ADDR: ":8100"
  GATEWAY_ORIGINS: "http://localhost:5173"

  AUTH_JWKS_URL: "http://auth:3200/api/auth/jwks"
  AUTH_ISSUER: "http://auth:3200"
  AUTH_AUDIENCE: "surge"

  SIM_TRANSPORT: "ws"
  SIM_WS_URL: "ws://gateway:8100/ws"
  SIM_DRIVERS: "1000"
  SIM_REQUESTS_PER_SECOND: "5"
