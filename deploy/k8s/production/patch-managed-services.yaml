# Anything carrying a credential comes from the Secret, not the ConfigMap.
#
# `env` entries win over `envFrom`, so these override whatever the base config
# says — which is what lets development point at in-cluster services and
# production at managed ones without two copies of every Deployment.
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: surge-secrets, key: DATABASE_URL } }
    - name: KAFKA_BROKERS
      valueFrom: { secretKeyRef: { name: surge-secrets, key: KAFKA_BROKERS } }
    - name: REDIS_ADDR
      valueFrom: { secretKeyRef: { name: surge-secrets, key: REDIS_ADDR } }
    - name: VALHALLA_URL
      valueFrom: { secretKeyRef: { name: surge-secrets, key: VALHALLA_URL } }
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      valueFrom: { secretKeyRef: { name: surge-secrets, key: OTEL_EXPORTER_OTLP_ENDPOINT } }
