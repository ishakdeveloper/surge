# trip
    #
    # Scales on nothing much. Transactional, and Postgres is the limit
    # long before the process is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip
  namespace: surge
  labels: { app: trip }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trip }
  template:
    metadata:
      labels: { app: trip }
    spec:
      containers:
        - name: trip
          image: surge/trip:dev
          # Never pulls: these images are built locally by Tilt or by `make
          # images`, and a cluster that tried to fetch them from a registry
          # would fail on every rollout.
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: surge-config }
            - secretRef: { name: surge-secrets }
          ports:
            - name: grpc
              containerPort: 8110
            - name: metrics
              containerPort: 9105
          # Liveness only. A readiness probe on these would take a pod out of
          # rotation when Kafka is briefly unavailable, which turns one broker
          # hiccup into an outage — the service is fine, its dependency is not.
          livenessProbe:
            httpGet: { path: /health, port: 9105 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
      # Long enough for the matcher to checkpoint its in-flight offers on the
      # way out. A shorter grace period turns every rollout into the ungraceful
      # path, where recovery rests entirely on offer deadlines.
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: trip
  namespace: surge
spec:
  selector: { app: trip }
  ports:
    - name: grpc
      port: 8110
      targetPort: grpc
    - name: metrics
      port: 9105
      targetPort: metrics
