# gateway
    #
    # Scales on connection count. Stateful about WHO is connected, so a
    # pod restart drops sockets and clients reconnect — which is why the
    # simulator redials on its next ping rather than giving up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: surge
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: surge/gateway:dev
          # Never pulls: these images are built locally by Tilt or by `make
          # images`, and a cluster that tried to fetch them from a registry
          # would fail on every rollout.
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: surge-config }
            - secretRef: { name: surge-secrets }
          ports:
            - name: http
              containerPort: 8100
            - name: metrics
              containerPort: 9104
          # Liveness only. A readiness probe on these would take a pod out of
          # rotation when Kafka is briefly unavailable, which turns one broker
          # hiccup into an outage — the service is fine, its dependency is not.
          livenessProbe:
            httpGet: { path: /health, port: 8100 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
      # Long enough for the matcher to checkpoint its in-flight offers on the
      # way out. A shorter grace period turns every rollout into the ungraceful
      # path, where recovery rests entirely on offer deadlines.
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: surge
spec:
  selector: { app: gateway }
  ports:
    - name: http
      port: 8100
      targetPort: http
    - name: metrics
      port: 9104
      targetPort: metrics
