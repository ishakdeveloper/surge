# ingest
#
# Scales on ping rate. Stateless between restarts: the position index rebuilds
# from the stream within one ping interval, which is why it consumes from the
# end of the log rather than replaying.
#
# No readiness probe: nothing routes traffic to it. It pulls from Kafka, and a
# pod that is not ready still pulls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: surge
  labels: { app: ingest }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
    spec:
      containers:
        - name: ingest
          image: surge/ingest
          envFrom:
            - configMapRef: { name: surge-shared }
            - configMapRef: { name: ingest-config }
          ports:
            - name: metrics
              containerPort: 9102
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: surge
spec:
  selector: { app: ingest }
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
