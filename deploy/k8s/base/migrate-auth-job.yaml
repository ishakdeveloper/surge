# The auth schema, from packages/database.
#
# A second migration job, because there are two owners: this one creates
# better-auth's tables and the jwks table the Go services verify against, while
# migrate-job.yaml creates the trip and payments tables. Neither writes to the
# other's, which is what stops "one Postgres, several services" from quietly
# becoming a shared-database coupling.
#
# The auth image carries the migration runner for exactly this.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-auth
  namespace: surge
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate-auth
          image: surge/auth
          command: ["node", "packages/database/build/bundle/migrate.js"]
          env:
            - name: AUTH_DATABASE_URL
              valueFrom: { secretKeyRef: { name: surge-database, key: AUTH_DATABASE_URL } }
