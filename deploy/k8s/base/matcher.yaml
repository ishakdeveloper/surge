# matcher
#
# Scales on geography. Kafka's consumer group decides which pods own which
# cells, so replicas here directly change the shard assignment — and changing
# it is a rebalance, which is the interesting path. More replicas than
# geo.events has partitions is a pod that owns nothing.
#
# No readiness probe: nothing routes traffic to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
  namespace: surge
  labels: { app: matcher }
spec:
  replicas: 3
  # One at a time. Each pod that leaves hands its partitions to the others, and
  # two leaving together is two rebalances overlapping.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app: matcher }
  template:
    metadata:
      labels: { app: matcher }
    spec:
      containers:
        - name: matcher
          image: surge/matcher
          envFrom:
            - configMapRef: { name: surge-shared }
            - configMapRef: { name: matcher-config }
          ports:
            - name: metrics
              containerPort: 9103
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
      # Long enough for the matcher to checkpoint its in-flight offers on the
      # way out. A shorter grace period turns every rollout into the ungraceful
      # path, where recovery rests entirely on offer deadlines.
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: matcher
  namespace: surge
spec:
  selector: { app: matcher }
  ports:
    - name: metrics
      port: 9103
      targetPort: metrics
