# simulator
#
# Not a product service — the load generator. One replica, because two would
# produce two drivers with the same id and their sequence numbers would
# interleave.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: surge
  labels: { app: simulator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: simulator }
  template:
    metadata:
      labels: { app: simulator }
    spec:
      containers:
        - name: simulator
          image: surge/simulator
          envFrom:
            - configMapRef: { name: surge-shared }
            - configMapRef: { name: simulator-config }
            # SIM_TOKEN_SECRET, shared with the gateway.
            - secretRef: { name: surge-secrets }
          ports:
            - name: control
              containerPort: 8101
            - name: grpc
              containerPort: 8111
            - name: metrics
              containerPort: 9101
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: simulator
  namespace: surge
spec:
  selector: { app: simulator }
  ports:
    - name: control
      port: 8101
      targetPort: control
    - name: grpc
      port: 8111
      targetPort: grpc
    - name: metrics
      port: 9101
      targetPort: metrics
