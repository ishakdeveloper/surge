# A laptop.
#
# Everything runs in-cluster, including the things that would be managed
# services anywhere real: Postgres, Redpanda, Valhalla and Jaeger. Storage is
# emptyDir, so a restart loses the data — which for a position stream and a
# load-test database is the honest trade rather than a compromise.
#
# The simulator is here and only here. It exists to generate load, it mints its
# own driver identities, and it has no business anywhere a real rider might be.
#
#   kubectl apply -k deploy/k8s/development
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: surge

resources:
  - ../base
  - infra.yaml
  - simulator.yaml

# Local images, built by `make images` or Tilt. No registry, so nothing tries
# to pull and fail.
images:
  - { name: surge/auth, newTag: dev }
  - { name: surge/gateway, newTag: dev }
  - { name: surge/ingest, newTag: dev }
  - { name: surge/matcher, newTag: dev }
  - { name: surge/trip, newTag: dev }
  - { name: surge/chat, newTag: dev }
  - { name: surge/fleet, newTag: dev }
  - { name: surge/simulator, newTag: dev }
  - { name: surge/migrate, newTag: dev }

configMapGenerator:
  - name: surge-config
    behavior: merge
    literals:
      # In-cluster everything.
      - KAFKA_BROKERS=redpanda:9092
      - REDIS_ADDR=redis:6379
      - VALHALLA_URL=http://valhalla:8002
      - DATABASE_URL=postgresql://surge:surge@postgres:5432/surge
      - AUTH_DATABASE_URL=postgresql://surge:surge@postgres:5432/surge_auth
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      # Sampled even here: exporting every span at ten thousand pings a second
      # makes the collector the bottleneck and the service under test spend its
      # time on telemetry.
      - OTEL_TRACES_SAMPLER_ARG=0.01
      - GATEWAY_ORIGINS=http://localhost:5273
      - SIM_DRIVERS=1000
      - SIM_REQUESTS_PER_SECOND=5
      # A laptop notifies nobody's phone.
      - CHAT_PUSH_PROVIDER=fake
      # Nobody's licence is checked on a laptop, and documents go nowhere.
      - FLEET_IDENTITY_PROVIDER=fake
      - FLEET_DOCUMENT_STORE=memory
      # And so nobody is approved either. A matcher gating on that here would
      # refuse the thousand simulated drivers this cluster exists to move.
      - MATCHER_REQUIRE_APPROVAL=false

patches:
  # One replica of everything. Three matchers on a laptop is three copies of the
  # same work competing for the same cores, and the sharding is just as
  # demonstrable at two.
  - target: { kind: Deployment, name: matcher }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: Deployment, name: ingest }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: trip }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: chat }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: fleet }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
