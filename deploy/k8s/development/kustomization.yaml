# A laptop.
#
# Everything runs in-cluster, including the things that would be managed
# services anywhere real: Postgres, Redpanda, Valhalla and Jaeger. Storage is
# emptyDir, so a restart loses the data — which for a position stream and a
# load-test database is the honest trade rather than a compromise.
#
# The simulator is here and only here. It exists to generate load, it mints its
# own driver identities, and it has no business anywhere a real rider might be.
#
# Public addresses are localhost, because that is what a browser reaches through
# Tilt's port-forwards: auth on 3200, the gateway on 8100, web on 5273.
#
#   kubectl apply -k deploy/k8s/development
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: surge

resources:
  - ../base
  - infra.yaml
  - simulator.yaml

# Local images, built by `make images` or Tilt. No registry, so nothing tries
# to pull and fail.
images:
  - { name: surge/auth, newTag: dev }
  - { name: surge/web, newTag: dev }
  - { name: surge/gateway, newTag: dev }
  - { name: surge/ingest, newTag: dev }
  - { name: surge/matcher, newTag: dev }
  - { name: surge/trip, newTag: dev }
  - { name: surge/payments, newTag: dev }
  - { name: surge/simulator, newTag: dev }
  - { name: surge/migrate, newTag: dev }

configMapGenerator:
  - name: surge-shared
    behavior: merge
    literals:
      - KAFKA_BROKERS=redpanda:9092
      # One broker, so one replica: anything more fails to create.
      - KAFKA_REPLICATION_FACTOR=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  - name: auth-config
    behavior: merge
    literals:
      - AUTH_BASE_URL=http://localhost:3200
      - WEB_URL=http://localhost:5273
  - name: web-config
    behavior: merge
    literals:
      - SURGE_API_URL=http://localhost:8100
      - SURGE_WS_URL=ws://localhost:8100/ws
      - AUTH_BASE_URL=http://localhost:3200
  - name: gateway-config
    behavior: merge
    literals:
      # Must equal auth's AUTH_BASE_URL, which is what it signs as.
      - AUTH_ISSUER=http://localhost:3200
      - GATEWAY_ORIGINS=http://localhost:5273
      - SIM_GRPC_ADDR=simulator:8111
  - name: payments-config
    behavior: merge
    literals:
      - PAYMENTS_PROCESSOR=fake
      - PAYMENTS_WEB_URL=http://localhost:5273
  - name: simulator-config
    envs: [simulator.env]

# Development credentials for the in-cluster Postgres, which are no secret —
# they are in infra.yaml a few lines away. Generated here so the base can name
# a Secret everywhere, and production supplies a real one under the same name.
secretGenerator:
  - name: surge-database
    literals:
      - DATABASE_URL=postgresql://surge:surge@postgres:5432/surge
      - AUTH_DATABASE_URL=postgresql://surge:surge@postgres:5432/surge_auth

patches:
  # Fewer replicas than production. Three matchers on a laptop is three copies
  # of the same work competing for the same cores, and the sharding is just as
  # demonstrable at two.
  - target: { kind: Deployment, name: matcher }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: Deployment, name: ingest }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: trip }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: payments }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
