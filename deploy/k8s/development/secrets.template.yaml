# What `make k8s-up` creates imperatively, for reference. It is not part of the
# kustomization and is never applied from here:
#
#   kubectl -n surge create secret generic surge-secrets \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=SIM_TOKEN_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=SIM_ENABLED=true
#
# SIM_ENABLED is what lets the gateway accept simulator-minted driver
# identities. It belongs nowhere near a real deployment, which is why it is a
# secret rather than config: making it awkward to set is the point.
#
# Database URLs are not here. They are the surge-database Secret, generated by
# the development kustomization and supplied separately in production.
apiVersion: v1
kind: Secret
metadata:
  name: surge-secrets
  namespace: surge
type: Opaque
stringData:
  AUTH_SECRET: "replace-me"
  SIM_TOKEN_SECRET: "replace-me-with-at-least-32-characters-of-entropy"
  SIM_ENABLED: "true"
