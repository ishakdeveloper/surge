apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    # Pinned, not generated: the committed dashboard references this uid, and a
    # Grafana that invents its own leaves every panel saying "datasource not
    # found" on a fresh clone.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
