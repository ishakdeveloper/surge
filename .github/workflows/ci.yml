name: ci

on:
  # Every branch, not just main: work happens in branches long before anything
  # merges, and CI that only runs on main is CI that tells you after the fact.
  push:
  pull_request:

# Read-only unless a job says otherwise.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One workflow, path-filtered, with one required check. Separate workflows with
# `paths:` look simpler and are not: a required check from a workflow that never
# triggered stays pending forever, so a docs-only change could never merge.
# Every job below runs only when what it checks changed, and `ci-ok` is the one
# status branch protection requires.
#
# Actions are pinned by commit, with the release in a comment. Renovate keeps
# both current.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      go: ${{ steps.filter.outputs.go }}
      proto: ${{ steps.filter.outputs.proto }}
      deploy: ${{ steps.filter.outputs.deploy }}
      wire: ${{ steps.filter.outputs.wire }}
      ci: ${{ steps.filter.outputs.ci }}
      images: ${{ steps.affected.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'patches/**'
              - '*.json'
              - '*.ts'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '**/*.md'
            go:
              - 'backend/**'
            proto:
              - 'proto/**'
            deploy:
              - 'deploy/**'
              - 'Tiltfile'
              - 'Makefile'
            wire:
              - 'backend/shared/wire/**'
            ci:
              - '.github/**'
              - 'scripts/**'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Which images this change touches: `go list -deps` for the Go services,
      # the workspace graph for auth and web. See scripts/affected.mjs.
      - id: affected
        run: node scripts/affected.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Runs the `prepare` script, which patches TypeScript and oxlint with the
      # Effect language service.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm check

      - run: pnpm lint

      # Coverage, not just the tests: the thresholds in vitest.config.ts are a
      # ratchet, and this is what holds it. Docker is on the runner, so the
      # testcontainers Postgres behind the auth and database tests is real —
      # including the one that proves the committed auth migrations leave
      # better-auth nothing to create.
      - run: pnpm coverage

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # The trip and payments repositories, the outbox and the ledger's
    # constraints are Postgres behaviour, and shared/pgtest skips them when no
    # database answers. Given one, each test migrates its own schema.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: surge
          POSTGRES_USER: surge
          POSTGRES_PASSWORD: surge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U surge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # A broker, so the Kafka tests run instead of skipping: topic
      # provisioning, the compacted-checkpoint read, the outbox relay. Not a
      # service container, because Actions cannot pass a service its arguments
      # and Redpanda needs dev-container mode to start on a runner.
      - name: redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v26.2.2 \
            redpanda start --mode=dev-container --smp=1 --memory=1G \
            --kafka-addr=external://0.0.0.0:19092 --advertise-kafka-addr=external://localhost:19092
          for _ in $(seq 1 60); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          docker logs redpanda
          exit 1

      # gofmt rather than a linter for style: the standard formatter is the
      # whole convention, and a diff here is a one-command fix.
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        working-directory: backend
        run: go vet ./...

      # Valhalla and the auth service are not here, so the tests that need them
      # skip. The Stripe contract test runs only when the repository has a
      # test-mode key as a secret; forks and their pull requests get none, and
      # it refuses a live key even if one is configured.
      - name: test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://surge:surge@localhost:55433/surge
          KAFKA_BROKERS: localhost:19092
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: go test -race -cover ./... | tee "$RUNNER_TEMP/go-test.txt"

      # Each package's floor is in backend/coverage-floors.txt; a package not
      # listed is new and held to 80%. See scripts/go-coverage-gate.sh.
      - name: coverage floors
        run: scripts/go-coverage-gate.sh backend/coverage-floors.txt < "$RUNNER_TEMP/go-test.txt"

      # Correctness and known CVEs, not taste. Pinned by version rather than as
      # go.mod tools, whose dependencies would join the services' module graph
      # and change every image's bytes. Both need a newer Go than the module
      # does, which `auto` fetches for them.
      - name: staticcheck
        working-directory: backend
        env:
          GOTOOLCHAIN: auto
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        working-directory: backend
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Everything committed that a tool writes, written again and compared. A diff
  # means someone changed the source and not the output, or the output by hand.
  codegen:
    needs: changes
    if: needs.changes.outputs.proto == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version the committed code names in its headers. The plugins are
      # pinned by go.sum, through the tool directives in backend/go.mod.
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "33.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: make proto

      - run: make wire-fixtures

      - run: pnpm --filter @surge/web routes

      - name: nothing generated differs from what is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::generated output is stale: run make proto, make wire-fixtures and pnpm --filter @surge/web routes, and commit the result"
            exit 1
          fi

  manifests:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.33.4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Render every overlay and validate what would be applied against the
      # Kubernetes schemas. A typo in a manifest fails here, not in a rollout.
      # kubeconform needs a newer Go than the module; setup-go pins the
      # toolchain to the module's, and `auto` lets this one step fetch its own.
      - name: kustomize and kubeconform
        env:
          GOTOOLCHAIN: auto
        run: |
          for env in development production; do
            kubectl kustomize "deploy/k8s/$env" > "$RUNNER_TEMP/$env.yaml"
          done
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 \
            -strict -summary -kubernetes-version 1.33.0 "$RUNNER_TEMP"/*.yaml

  # Services roll one at a time, so the version being replaced and the version
  # replacing it run side by side. What one writes, the other has to read.
  compat:
    needs: changes
    if: (needs.changes.outputs.proto == 'true' || needs.changes.outputs.wire == 'true' || needs.changes.outputs.ci == 'true') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A checker only: `make proto` still generates with protoc.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: 1.73.0

      # Against where this branch left main, not main's tip. Main moves on
      # without it — a proto added there since would read as "deleted" here —
      # and what this checks is whether this branch's own change breaks
      # anything. Main's own run checks the merge.
      - name: where this branch left main
        id: base
        run: echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"

      - name: the protos stay compatible with where this branch began
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: buf breaking proto --against ".git#ref=$BASE,subdir=proto"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The geo.events records the base wrote, decoded by this branch's code. A
      # base from before the fixtures existed has none, and the test skips.
      - name: the base's geo.events records still decode
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git archive "$BASE" backend/shared/wire/testdata | tar -x -C "$base" || true
          cd backend
          GEO_FIXTURES="$base/backend/shared/wire/testdata/geo" \
            go test ./shared/wire -run TestGeoEventsDecodeFromFixtures -v

  # Only the images this change touches, built the way a release builds them,
  # scanned, and — on main, once the registry exists — pushed.
  images:
    needs: changes
    if: needs.changes.outputs.images != '' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged for a short-lived Google credential. Only main's workflows
      # may impersonate the pusher; see deploy/terraform/gcp/bootstrap.
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.REGISTRY != '' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: which Dockerfile
        id: spec
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            auth | web) echo "file=apps/$IMAGE/Dockerfile" >> "$GITHUB_OUTPUT"
                        echo "args=" >> "$GITHUB_OUTPUT" ;;
            migrate)    echo "file=deploy/docker/go.Dockerfile" >> "$GITHUB_OUTPUT"
                        echo "args=PACKAGE=tools/migrate" >> "$GITHUB_OUTPUT" ;;
            *)          echo "file=deploy/docker/go.Dockerfile" >> "$GITHUB_OUTPUT"
                        echo "args=PACKAGE=services/$IMAGE/cmd" >> "$GITHUB_OUTPUT" ;;
          esac

      # Same source, same bytes. Every timestamp in the image is the commit's,
      # so a service whose inputs did not change builds to the same digest and
      # its Deployment is left alone. Two uncached builds of the gateway were
      # compared before this was relied on.
      - name: reproducible
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ steps.spec.outputs.file }}
          build-args: |
            ${{ steps.spec.outputs.args }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: surge/${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Known, fixable, serious. An unfixed CVE is not something this change
      # can act on; a fixed one is a base image or a dependency to bump. Before
      # the push, so nothing that fails it reaches the registry.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: surge/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: registry host
        if: env.PUSH == 'true'
        id: registry
        env:
          REGISTRY: ${{ vars.REGISTRY }}
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: env.PUSH == 'true'
        id: gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSH_SA }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      # The same build again, from the cache, pushed under the commit it came
      # from. The SHA tag is for people; what deploys is the digest.
      #
      # No provenance or SBOM attestation here, deliberately. Inside the image
      # index an attestation carries the build's own time, so the index digest
      # would change on every build and every service would roll on every
      # deploy. They come back as attestations attached by reference, which
      # leave the image's digest alone.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: env.PUSH == 'true'
        id: push
        with:
          context: .
          file: ${{ steps.spec.outputs.file }}
          build-args: |
            ${{ steps.spec.outputs.args }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ vars.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}

      # What the deploy pins: one file per image, holding its digest reference.
      - name: record the digest
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          REGISTRY: ${{ vars.REGISTRY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$REGISTRY/$IMAGE@$DIGEST" > "digests/$IMAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.image }}
          path: digests/
          retention-days: 90

  # The whole system, from the images this commit builds, through a browser:
  # sign-in, a trip seen from both ends, the ops console. See e2e/.
  e2e:
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # surge-valhalla-ams is published to this repository's packages.
      packages: read
    env:
      SURGE_TAG: ci
      VALHALLA_IMAGE: ghcr.io/${{ github.repository_owner }}/surge-valhalla-ams:latest
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/e2e.yml --profile app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nine images, the routing tiles and the whole stack's data do not fit
      # on a runner as it comes: the first run filled the disk until Redpanda
      # raised a storage alert and marked itself unhealthy. The runner ships
      # SDKs nothing here uses; those go first.
      - name: room on the disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # All nine from docker-bake.hcl, reading the layers the images job
      # cached, so these are the artifacts that ship and not a second recipe.
      - name: every image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          TAG: ci
          CACHE: gha
        with:
          source: .
          load: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: surge-valhalla-ams
        id: valhalla
        continue-on-error: true
        run: docker pull "$VALHALLA_IMAGE"

      # Until the weekly workflow has published one, build it here: twenty
      # minutes the first time, and a cache hit after.
      - if: steps.valhalla.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/docker
          file: deploy/docker/valhalla.Dockerfile
          tags: ${{ env.VALHALLA_IMAGE }}
          load: true
          cache-from: type=gha,scope=valhalla
          cache-to: type=gha,mode=max,scope=valhalla

      # Every image is loaded into Docker now, so the builder's own copy of
      # them — and of the extract the tiles were built from — is only disk.
      - name: drop the build cache
        run: docker buildx prune --all --force && df -h /

      # Both migrators run first, as one-shot containers; everything else waits
      # for them and then for its own health check.
      - name: the stack
        run: $COMPOSE up -d --wait --wait-timeout 900 auth web gateway ingest matcher trip payments chat fleet simulator

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: chromium
        run: pnpm --filter @surge/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @surge/e2e test

      - name: every service's logs
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color > "$RUNNER_TEMP/compose.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
            ${{ runner.temp }}/compose.log
          retention-days: 14

  # The one required check. Skipped jobs count as passed — they had nothing to
  # check — and anything failed or cancelled fails this.
  ci-ok:
    if: always()
    needs: [changes, ts, go, codegen, manifests, compat, images, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed or had nothing to do
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
