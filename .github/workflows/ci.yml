name: ci

on:
  # Every branch, not just main: a boilerplate is forked and worked on in
  # branches long before anything merges, and CI that only runs on main is CI
  # that tells you after the fact.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Runs the `prepare` script, which patches TypeScript and oxlint with the
      # Effect language service.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm check

      - run: pnpm lint

      # Docker is available on ubuntu-latest, so the testcontainers-backed
      # Postgres started by test/global-setup.ts runs here rather than skipping.
      - run: pnpm test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      # gofmt rather than a linter: the standard formatter is the whole
      # convention, and a diff here is a one-command fix.
      - name: gofmt
        working-directory: services
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        working-directory: services
        run: go vet ./...

      # The tests that need Redpanda, Valhalla or the auth service skip when
      # those are absent rather than failing, so this runs the pure logic:
      # geo, config, the position index, and the polyline decoder against a
      # committed Valhalla fixture.
      - name: test
        working-directory: services
        run: go test ./...
