name: ci

on:
  # Every branch, not just main: a boilerplate is forked and worked on in
  # branches long before anything merges, and CI that only runs on main is CI
  # that tells you after the fact.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Runs the `prepare` script, which patches TypeScript and oxlint with the
      # Effect language service.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm check

      - run: pnpm lint

      # Docker is available on ubuntu-latest, so the testcontainers-backed
      # Postgres started by test/global-setup.ts runs here rather than skipping.
      - run: pnpm test

  go:
    runs-on: ubuntu-latest
    # The trip and payments repositories, the outbox and the ledger's
    # constraints are Postgres behaviour, and shared/pgtest skips them when no
    # database answers. Given one, each test migrates its own schema.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: surge
          POSTGRES_USER: surge
          POSTGRES_PASSWORD: surge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U surge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # gofmt rather than a linter: the standard formatter is the whole
      # convention, and a diff here is a one-command fix.
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        working-directory: backend
        run: go vet ./...

      # The tests that need Redpanda, Valhalla or the auth service skip when
      # those are absent rather than failing. Postgres is here, so everything
      # behind shared/pgtest runs for real.
      #
      # The Stripe contract test runs only when the repository has a test-mode
      # key as a secret. Forks and pull requests from them get no secrets, so
      # there it skips — and it refuses a live key even if one is configured.
      - name: test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://surge:surge@localhost:55433/surge
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: go test ./...
