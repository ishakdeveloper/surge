# Opens the app on the sign-in screen, whatever state the last run left it in.
#
# Not `clearState`: iOS keeps the Keychain — where the session cookie lives —
# across an app-data reset, so a cleared app can still be signed in. Signing
# out through the app is the only reliable way to start signed out.
#
# Defaults are written as `${VAR || '…'}` rather than an `env:` block, because
# a flow's own `env:` wins over `-e` on the command line — which would pin the
# flows to one Metro port and one auth service.
#
# The Account tab is matched as `Account.*`: iOS labels a tab button with its
# position as well as its title ("Account, tab, 3 of 3"), and a Maestro text
# matches the whole label.
#
# The app is the development build — Expo Go cannot load it, since the map and
# background location are native — so the link is the dev client's own, naming
# the Metro server to load the bundle from.
appId: ${APP_ID || 'com.ishakdeveloper.surge'}
---
- launchApp
- openLink: ${APP_URL || 'surge://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'}
# The dev client gives up if Metro was slow to answer the first request.
- runFlow:
    when:
      visible: "Try again"
    commands:
      - tapOn: "Try again"
# The dev client opens its developer menu over the app on a fresh launch,
# covering the screen underneath — so it counts as loaded, and is closed first.
- extendedWaitUntil:
    visible:
      text: "Email me a code|Account.*|Get started|This is the developer menu.*"
    timeout: 90000
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn:
          id: "xmark"
# Again, for whatever the menu was covering: a `when` is checked once, and the
# menu may still be sliding away.
- extendedWaitUntil:
    visible:
      text: "Email me a code|Account.*|Get started"
    timeout: 30000
# An account that signed in but never finished onboarding lands there instead
# of on a tab, and onboarding has no tabs to reach the account from.
- runFlow:
    when:
      visible: "Get started"
    commands:
      - tapOn: "Skip setup"
      - extendedWaitUntil:
          visible: "Account.*"
          timeout: 30000
- runFlow:
    when:
      visible: "Account.*"
    commands:
      - tapOn: "Account.*"
      # Centred, not merely on screen: the tab bar floats over the bottom of
      # every tab, and a tap on an element under it goes to the bar instead.
      - scrollUntilVisible:
          element:
            id: "sign-out"
          centerElement: true
      - tapOn:
          id: "sign-out"
      # Signing out is asked once first: it is a long way back in with a code.
      - extendedWaitUntil:
          visible: "Sign out of Surge?"
          timeout: 10000
      - tapOn:
          id: "confirm-sign-out"
- extendedWaitUntil:
    visible: "Email me a code"
    timeout: 30000
