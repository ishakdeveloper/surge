# A new driver signs up with a phone code, stands at Centraal and goes online.
#
# The status the matcher is told is shown on the Drive tab as it is sent, so
# `idle` appearing is the ping loop running against the gateway with the
# driver available. Takes the same -e overrides as the rider flow.
appId: ${APP_ID || 'host.exp.Exponent'}
---
- runFlow: common/start-signed-out.yaml
# The phone link is a quiet line under the form, off the bottom of a small
# screen until it is scrolled to.
- scrollUntilVisible:
    element:
      id: "method-phone"
    centerElement: true
- tapOn:
    id: "method-phone"
- evalScript: ${output.phone = '+3161' + String(Date.now()).slice(-7)}
- tapOn:
    id: "field-phone"
- inputText: ${output.phone}
- tapOn:
    id: "role-driver"
- tapOn: "Text me a code"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
- runScript:
    file: scripts/latest-code.js
    env:
      TO: ${output.phone}
      AUTH_URL: ${AUTH_URL || 'http://localhost:3200'}
- tapOn:
    id: "field-code"
- inputText: ${output.code}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    file: common/finish-onboarding.yaml
    env:
      NAME: "Sam"
- tapOn: "Start your first shift"

# The driver's own screen: stand somewhere the matcher covers, then go on
# shift. The spot chips sit on the sheet under the map.
- extendedWaitUntil:
    visible: "You're offline"
    timeout: 30000
# Centred rather than merely on screen: the floating tab bar would take a tap
# meant for anything under it.
- scrollUntilVisible:
    element: "Centraal"
    centerElement: true
- tapOn: "Centraal"
- scrollUntilVisible:
    element: "Go online"
    centerElement: true
- tapOn: "Go online"
- extendedWaitUntil:
    visible: "You're online"
    timeout: 15000
# What the matcher is told, shown on the sheet as it is sent. Waited for
# rather than scrolled to: the only scrollable in reach is the row of spots,
# and the status sits below it on the same sheet.
- extendedWaitUntil:
    visible: "idle"
    timeout: 20000
